[project]
name = "equalexperts_dataeng_exercise"
version = "0.1.0"
description = "The Python version of the Equal Experts data engineering challenge"
authors = [{ name = "Equal Experts", email = "data@equalexperts.com" }]
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.14,<3.15"
dependencies = [
    "requests>=2.32.0,<3.0.0",
    "typer>=0.27.0,<1.0.0",
    "duckdb>=1.5.5,<2.0.0",
]

[project.scripts]
exercise = "equalexperts_dataeng_exercise.scripts.exercise:main"

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.12.0,<1.0.0",
    "types-requests>=2.33.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
omit = ["__init__.py", "exercise.py", "fetch_data.py"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C", "E", "F", "I", "W"]
ignore = ["E203", "E266", "E501"]
