name: Python Exercise

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install, lint and test
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run exercise lint
      - run: uv run exercise test
